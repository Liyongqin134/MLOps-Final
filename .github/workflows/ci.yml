name: CI/CD

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [staging, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python ml/data_pipeline.py
      - run: python ml/train.py
      - run: python -m pytest tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python ml/data_pipeline.py
      - run: python ml/train.py
      - name: Build Docker image
        run: docker build -t app:test .

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create staging .env from secret
        run: echo "${{ secrets.STAGING_APP_ENV }}" > .env
      - name: Build staging image
        run: docker build -t liyongqin134/mlops-final:staging .
      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u liyongqin134 --password-stdin
          docker push liyongqin134/mlops-final:staging

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create production .env from secret
        run: echo "${{ secrets.PROD_APP_ENV }}" > .env
      - name: Build production image
        run: docker build -t liyongqin134/mlops-final:latest .
      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u liyongqin134 --password-stdin
          docker push liyongqin134/mlops-final:latest